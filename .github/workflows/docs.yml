name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Default permissions are minimal; elevated permissions are set per-job where needed.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ".[docs]"

      - name: Build documentation with warnings as errors
        run: |
          python -m sphinx -T -W --keep-going -b html -d docs/_build/doctrees-html docs/source docs/_build/html
          python -m sphinx -T -W --keep-going -b epub -d docs/_build/doctrees-epub docs/source docs/_build/epub
          python -m sphinx -T -W --keep-going -b latex -d docs/_build/doctrees-latex docs/source docs/_build/latex

      - name: Check documentation build
        run: |
          ls -la docs/_build/html/
          test -f docs/_build/html/index.html
          test -f docs/_build/html/.nojekyll
          test ! -e docs/_build/epub/.nojekyll

      # Optional: keep a build artifact for debugging / downloads from Actions UI
      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: docs/_build/html/
          retention-days: 30

      # Upload the Pages artifact (used by actions/deploy-pages)
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest

    permissions:
      pages: write      # required by deploy-pages
      id-token: write   # required by deploy-pages (OIDC)

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  linkcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ".[docs]"

      - name: Check links
        run: |
          cd docs
          make linkcheck
        continue-on-error: true
